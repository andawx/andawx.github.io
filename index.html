<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albanian Trivia Challenge</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap');
        
        :root {
            --red: #C60C30;
            --black: #000000;
            --white: #FFFFFF;
            --gold: #FFD700;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--red);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100"><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="20" fill="rgba(0,0,0,0.1)">ALBANIA</text></svg>');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 50%;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.5em;
            color: var(--gold);
        }

        button {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid transparent;
            border-radius: 8px;
            background-color: var(--black);
            color: var(--white);
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }

        button:hover {
            background-color: var(--red);
            border-color: var(--gold);
        }

        #game-screen {
            display: none;
        }

        #question-text {
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .answer-button:hover {
            background-color: var(--red);
            border-color: var(--gold);
        }

        #feedback {
            margin-top: 15px;
            font-size: 1.2em;
            font-weight: bold;
            min-height: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="home-screen">
            <h1>🇦🇱 Albanian Trivia Challenge 🇦🇱</h1>
            <p>Test your knowledge of Albanian history and culture!</p>
            <button id="play-button">Play Now</button>
            <button id="leaderboard-button">Leaderboard</button>
            <button id="daily-challenge-button">Daily Challenge</button>
        </div>

        <div id="game-screen">
            <h2 id="question-text">Question will appear here...</h2>
            <div id="answers">
                <button class="answer-button"></button>
                <button class="answer-button"></button>
                <button class="answer-button"></button>
                <button class="answer-button"></button>
            </div>
            <div id="feedback"></div>
        </div>
    </div>

    <script>
        // Simple game state
        let currentQuestionIndex = 0;
        let score = 0;
        let lives = 3;

        // An array of trivia questions
        const questions = [
            {
                question: "Which city is called the ‘City of a Thousand Windows’?",
                answers: ["Tirana", "Shkodra", "Berat", "Vlora"],
                correctAnswer: "Berat"
            },
            {
                question: "What does ‘mirëmëngjes’ mean?",
                answers: ["Good morning", "Thank you", "Hello", "Goodbye"],
                correctAnswer: "Good morning"
            },
            {
                question: "Who was Albania’s first Prime Minister after independence?",
                answers: ["Sali Berisha", "Ismail Qemali", "Enver Hoxha", "Gjergj Kastrioti"],
                correctAnswer: "Ismail Qemali"
            }
        ];

        // Get DOM elements
        const homeScreen = document.getElementById('home-screen');
        const gameScreen = document.getElementById('game-screen');
        const playButton = document.getElementById('play-button');
        const questionText = document.getElementById('question-text');
        const answerButtons = document.querySelectorAll('.answer-button');
        const feedbackDiv = document.getElementById('feedback');

        // Event listener for the "Play Now" button
        playButton.addEventListener('click', () => {
            homeScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            loadQuestion();
        });

        // Function to load a new question
        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                endGame();
                return;
            }
            
            const currentQuestion = questions[currentQuestionIndex];
            questionText.textContent = currentQuestion.question;
            feedbackDiv.textContent = ''; // Clear previous feedback

            // Populate answer buttons
            answerButtons.forEach((button, index) => {
                button.textContent = currentQuestion.answers[index];
                button.onclick = () => handleAnswerClick(button.textContent, currentQuestion.correctAnswer);
            });
        }

        // Function to handle answer clicks
        function handleAnswerClick(selectedAnswer, correctAnswer) {
            if (selectedAnswer === correctAnswer) {
                feedbackDiv.textContent = '✅ Correct!';
                feedbackDiv.style.color = 'lightgreen';
            } else {
                feedbackDiv.textContent = '❌ Wrong!';
                feedbackDiv.style.color = 'red';
            }

            // Move to the next question after a short delay
            setTimeout(() => {
                currentQuestionIndex++;
                loadQuestion();
            }, 1000);
        }

        // Function to handle the end of the game
        function endGame() {
            questionText.textContent = 'Game Over! Your final score is: ' + score;
            document.getElementById('answers').innerHTML = ''; // Clear buttons
            feedbackDiv.textContent = 'Thanks for playing!';
        }
    </script>
</body>
</html>
