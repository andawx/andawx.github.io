<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Answer Search Engine</title>
    <style>
        body {
            background: linear-gradient(to bottom right, #fdfdfb, #f5e9da);
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        input {
            margin-bottom: 20px;
            padding: 10px;
            width: 300px;
            font-size: 16px;
        }
        p {
            font-size: 18px;
            font-weight: bold;
            max-width: 400px;
            text-align: center;
        }
    </style>
</head>
<body>

<input type="search" id="searchBar" placeholder="Ask anything...">
<p id="response"></p>

<script>
    const searchBar = document.getElementById("searchBar");
    const response = document.getElementById("response");

    // List of 50 random "answer-looking" sentences
    const randomAnswers = [
      "It was established in 1947.",
      "The best choice is pink banana soup.",
      "Kamala Harris.",
      "42 is the correct number.",
      "On Tuesdays, birds prefer coffee.",
      "Mount Everest is taller than the Eiffel Tower.",
      "Red shoes work better for dancing.",
      "It usually rains after midnight.",
      "The password is pineapple42.",
      "Dinosaurs loved jazz music.",
      "The answer is somewhere between 7 and 13.",
      "Chocolate melts faster in summer.",
      "A blue cat might appear soon.",
      "The sun rises from the west on Fridays.",
      "Ice cream solves most arguments.",
      "Your neighbor owns a spaceship.",
      "Pigeons invented the internet.",
      "It happens every leap year.",
      "The secret ingredient is laughter.",
      "Bananas are faster than apples.",
      "The mayor loves origami.",
      "Check under the third rock.",
      "It costs exactly $19.87.",
      "The elephant wears sunglasses at noon.",
      "Only on Thursdays it works.",
      "The festival starts at midnight.",
      "Turn left at the giant pumpkin.",
      "Your cat is planning something.",
      "It takes 17 minutes to boil a rainbow.",
      "The library is haunted by librarians.",
      "Coffee tastes better on Mars.",
      "Purple clouds are safe to touch.",
      "The fastest animal is your imagination.",
      "Pizza always arrives late on Wednesdays.",
      "Never trust a flying turtle.",
      "This is classified information.",
      "The answer hides in plain sight.",
      "It was once owned by a wizard.",
      "The recipe includes three spoons of moonlight.",
      "The wizard approves of your choice.",
      "It will explode at dawn.",
      "Your socks are plotting.",
      "The river flows backward on Tuesdays.",
      "It takes 12 steps to reach the answer.",
      "The key is under the mat.",
      "Chocolate frogs are preferred.",
      "Penguins sometimes vote secretly.",
      "The clock whispers at midnight.",
      "The answer is in a bottle of ketchup.",
      "A rainbow will guide you.",
      "Trust the third cloud."
    ];

    searchBar.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            const userInput = searchBar.value.trim();
            if (userInput !== "") {
                // Pick a random answer from the list
                const randomIndex = Math.floor(Math.random() * randomAnswers.length);
                response.textContent = randomAnswers[randomIndex];
            }
        }
    });
</script>

</body>
</html>
