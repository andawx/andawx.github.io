<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totally Wrong Search Engine</title>
    <style>
        body {
            background: linear-gradient(to bottom right, #fdfdfb, #f5e9da);
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <input type="search" id="searchBar" placeholder="Type your question...">
    <p id="response"></p>

    <script>
        const searchBar = document.getElementById("searchBar");
        const response = document.getElementById("response");

        searchBar.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                const userInput = searchBar.value.trim();
                if (userInput !== "") {
                    response.textContent = "Processing your (definitely wrong) answer...";
                    // later, we'll replace this line with the random incorrect answers
                }
            }
        });
    </script>

</body>
</html>
