<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квиз за вежбање граматика</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex items-center justify-center">

    <div id="quiz-container" class="w-full max-w-xl bg-white shadow-2xl rounded-xl p-6 md:p-10 border border-gray-100">
        <h1 class="text-3xl font-extrabold text-indigo-700 mb-6 text-center">Квиз за вежбање граматика</h1>

        <!-- Round Selection Screen -->
        <div id="round-selection" class="text-center">
            <p class="text-lg text-gray-700 mb-6">Избери рунда за да започнеш:</p>
            <div id="round-buttons" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                <!-- Buttons will be injected here -->
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <h2 id="round-title" class="text-2xl font-bold text-gray-800 mb-4 text-center"></h2>
            
            <div class="bg-indigo-50 p-4 rounded-lg mb-6 shadow-inner">
                <p class="text-sm font-semibold text-indigo-600">Прашање <span id="current-question-nr"></span>/10</p>
                <p id="question-text" class="text-xl mt-2 font-medium text-gray-900"></p>
            </div>

            <p class="text-md font-semibold text-gray-600 mb-3">Избери го точниот збор:</p>

            <div id="options-container" class="space-y-3 mb-6">
                <!-- Options will be injected here -->
            </div>

            <div id="feedback" class="p-3 rounded-lg text-center mb-6 hidden font-medium"></div>

            <div class="flex justify-between items-center">
                <p class="text-lg font-bold text-gray-700">Резултат: <span id="score-display" class="text-indigo-600">0</span></p>
                <button id="next-button" class="px-6 py-3 bg-indigo-600 text-white font-bold rounded-lg shadow-md hover:bg-indigo-700 transition duration-150 disabled:bg-gray-400" disabled>
                    Следно
                </button>
                <button id="check-button" class="px-6 py-3 bg-green-500 text-white font-bold rounded-lg shadow-md hover:bg-green-600 transition duration-150">
                    Провери го одговорот
                </button>
            </div>
        </div>

        <!-- Completion Screen -->
        <div id="completion-screen" class="hidden text-center">
            <h2 class="text-3xl font-extrabold text-green-600 mb-4">Рунда завршена!</h2>
            <p class="text-xl text-gray-700 mb-6">Вашиот финален резултат е: <span id="final-score" class="text-green-600 font-bold"></span>/10</p>
            <button onclick="resetQuiz()" class="px-6 py-3 bg-indigo-600 text-white font-bold rounded-lg shadow-md hover:bg-indigo-700 transition duration-150">
                Избери друга рунда
            </button>
        </div>
    </div>

    <script>
        // Data structure for the entire quiz
        const quizData = [
            // =======================================================================
            // РУНДА 1 - САМО ЕДЕН ПРИМЕР (ВЕ МОЛИМЕ ПОПОЛНЕТЕ ДО 10)
            // =======================================================================
            {
                title: "Рунда 1: (Место за вашиот наслов)",
                questions: [
                    { text: "Пример: Јас [SELECT_WORD] во Скопје.", options: ["живее", "живеам", "живеат"], answer: "живеам" },
                    // Додадете ги сите 10 прашања за Рунда 1
                ]
            },
            // =======================================================================
            // РУНДА 2 - САМО ЕДЕН ПРИМЕР (ВЕ МОЛИМЕ ПОПОЛНЕТЕ ДО 10)
            // =======================================================================
            {
                title: "Рунда 2: (Место за вашиот наслов)",
                questions: [
                    { text: "Пример: Ти [SELECT_WORD] да играш фудбал.", options: ["сакаме", "сакаш", "сакам"], answer: "сакаш" },
                    // Додадете ги сите 10 прашања за Рунда 2
                ]
            },
            // =======================================================================
            // РУНДА 3 - САМО ЕДЕН ПРИМЕР (ВЕ МОЛИМЕ ПОПОЛНЕТЕ ДО 10)
            // =======================================================================
            {
                title: "Рунда 3: (Место за вашиот наслов)",
                questions: [
                    { text: "Пример: Тој [SELECT_WORD] автомобил.", options: ["возиме", "вози", "возиш"], answer: "вози" },
                    // Додадете ги сите 10 прашања за Рунда 3
                ]
            },
            // =======================================================================
            // РУНДА 4 - САМО ЕДЕН ПРИМЕР (ВЕ МОЛИМЕ ПОПОЛНЕТЕ ДО 10)
            // =======================================================================
            {
                title: "Рунда 4: (Место за вашиот наслов)",
                questions: [
                    { text: "Пример: Ние [SELECT_WORD] во канцеларија.", options: ["работи", "работат", "работиме"], answer: "работиме" },
                    // Додадете ги сите 10 прашања за Рунда 4
                ]
            },
            // =======================================================================
            // РУНДА 5 - САМО ЕДЕН ПРИМЕР (ВЕ МОЛИМЕ ПОПОЛНЕТЕ ДО 10)
            // =======================================================================
            {
                title: "Рунда 5: (Место за вашиот наслов)",
                questions: [
                    { text: "Пример: Тие [SELECT_WORD] рано наутро.", options: ["стануваш", "стануваат", "станувам"], answer: "стануваат" },
                    // Додадете ги сите 10 прашања за Рунда 5
                ]
            },
            // =======================================================================
            // РУНДА 6 (СЕГАШНО ПРОСТО ВРЕМЕ: ЈАС ПРАВАМ, НЕ ПРАВАМ, ДАЛИ ПРАВАМ?)
            // =======================================================================
            {
                title: "Рунда 6: Сегашно просто време (I do, I don’t, Do I?)",
                questions: [
                    { 
                        text: "Јас [SELECT_WORD] појадок секое утро.", 
                        options: ["јадам", "јаде", "јадеш"], 
                        answer: "јадам" 
                    },
                    { 
                        text: "Таа не [SELECT_WORD] шпански.", 
                        options: ["зборува", "зборуваат", "зборуваш"], 
                        answer: "зборува" 
                    },
                    { 
                        text: "Дали ние [SELECT_WORD] на училиште со автобус?", 
                        options: ["одиме", "одам", "оди"], 
                        answer: "одиме" 
                    },
                    { 
                        text: "Тој [SELECT_WORD] фудбал за време на викенди.", 
                        options: ["игра", "играш", "играат"], 
                        answer: "игра" 
                    },
                    { 
                        text: "Тие не [SELECT_WORD] во голем град.", 
                        options: ["живеат", "живееш", "живее"], 
                        answer: "живеат" 
                    },
                    { 
                        text: "Тоа [SELECT_WORD] добро. (Телефонот)", 
                        options: ["работи", "работам", "работат"], 
                        answer: "работи" 
                    },
                    { 
                        text: "Дали ти [SELECT_WORD] пица?", 
                        options: ["сакаш", "сака", "сакаат"], 
                        answer: "сакаш" 
                    },
                    { 
                        text: "Јас не [SELECT_WORD] кафе навечер.", 
                        options: ["пијам", "пие", "пијат"], 
                        answer: "пијам" 
                    },
                    { 
                        text: "Моите родители [SELECT_WORD] телевизија навечер.", 
                        options: ["гледаат", "гледам", "гледа"], 
                        answer: "гледаат" 
                    },
                    { 
                        text: "Мачката [SELECT_WORD] на столот.", 
                        options: ["спие", "спијам", "спиеш"], 
                        answer: "спие" 
                    }
                ]
            },
            // =======================================================================
            // РУНДА 7 (ЗБОРОВИ ЗА ПРАШАЊА И РЕД НА ЗБОРОВИ)
            // =======================================================================
            {
                title: "Рунда 7: Зборови за прашања и Ред на зборови",
                questions: [
                    { 
                        text: "[SELECT_WORD] е твојата омилена боја?", 
                        options: ["Кој", "Која", "Што"], 
                        answer: "Која" 
                    },
                    { 
                        text: "Ти [SELECT_WORD] на училиште секој ден.", 
                        options: ["одиш", "одиме", "одам"], 
                        answer: "одиш" 
                    },
                    { 
                        text: "[SELECT_WORD] е мојата книга?", 
                        options: ["Кога", "Каде", "Зошто"], 
                        answer: "Каде" 
                    },
                    { 
                        text: "Тие [SELECT_WORD] филм навечер.", 
                        options: ["гледаат", "гледа", "гледаш"], 
                        answer: "гледаат" 
                    },
                    { 
                        text: "[SELECT_WORD] си толку среќен?", 
                        options: ["Кој", "Зошто", "Што"], 
                        answer: "Зошто" 
                    },
                    { 
                        text: "Јас [SELECT_WORD] кафе наутро.", 
                        options: ["пијам", "пие", "пиеш"], 
                        answer: "пијам" 
                    },
                    { 
                        text: "Дали [SELECT_WORD] да спиеш сега?", 
                        options: ["сакаш", "сака", "сакаме"], 
                        answer: "сакаш" 
                    },
                    { 
                        text: "[SELECT_WORD] часот е сега?", 
                        options: ["Колку", "Каде", "Кога"], 
                        answer: "Колку" 
                    },
                    { 
                        text: "Мајка ми [SELECT_WORD] торта.", 
                        options: ["прави", "прават", "правам"], 
                        answer: "прави" 
                    },
                    { 
                        text: "[SELECT_WORD] си доаѓаш дома?", 
                        options: ["Што", "Како", "Кога"], 
                        answer: "Кога" 
                    }
                ]
            },
            // =======================================================================
            // НОВА РУНДА 8: ПРИЛОЗИ ЗА ФРЕКВЕНЦИЈА
            // =======================================================================
            {
                title: "Рунда 8: Прилози за фреквенција (Adverbs of Frequency)",
                questions: [
                    { 
                        text: "Таа [SELECT_WORD] доаѓа на час доцна.", 
                        options: ["никогаш", "секогаш", "понекогаш"], 
                        answer: "никогаш" 
                    },
                    { 
                        text: "Ние [SELECT_WORD] јадеме вечера во 7 часот.", 
                        options: ["обично", "ретко", "никогаш"], 
                        answer: "обично" 
                    },
                    { 
                        text: "Тој [SELECT_WORD] заборава на роденденот на сопругата.", 
                        options: ["никогаш", "често", "секогаш"], 
                        answer: "секогаш" 
                    },
                    { 
                        text: "Дали вие [SELECT_WORD] одите во кино?", 
                        options: ["понекогаш", "често", "секогаш"], 
                        answer: "често" 
                    },
                    { 
                        text: "Јас [SELECT_WORD] читам книга пред спиење.", 
                        options: ["понекогаш", "ретко", "секогаш"], 
                        answer: "секогаш" 
                    },
                    { 
                        text: "Тие [SELECT_WORD] патуваат во странство.", 
                        options: ["ретко", "секогаш", "обично"], 
                        answer: "ретко" 
                    },
                    { 
                        text: "Сонцето [SELECT_WORD] заоѓа на исток.", 
                        options: ["никогаш", "често", "понекогаш"], 
                        answer: "никогаш" 
                    },
                    { 
                        text: "Ние [SELECT_WORD] пиеме вода по вежбање.", 
                        options: ["секогаш", "ретко", "понекогаш"], 
                        answer: "секогаш" 
                    },
                    { 
                        text: "[SELECT_WORD] таа доаѓа да те види?", 
                        options: ["Каде", "Колку често", "Кој"], 
                        answer: "Колку често" 
                    },
                    { 
                        text: "Тоа [SELECT_WORD] се случува во нашиот град.", 
                        options: ["често", "ретко", "обично"], 
                        answer: "ретко" 
                    }
                ]
            },
            // =======================================================================
            // НОВА РУНДА 9: СУБЈЕКТ НАСПРОТИ ОБЈЕКТ ЗАМЕНКИ
            // =======================================================================
            {
                title: "Рунда 9: Субјект наспроти Објект заменки (I/Me, She/Her)",
                questions: [
                    { 
                        text: "Ти и [SELECT_WORD] сме пријатели.", 
                        options: ["мене", "јас"], 
                        answer: "јас" 
                    },
                    { 
                        text: "Тој ѝ даде подарок на [SELECT_WORD].", 
                        options: ["таа", "неа"], 
                        answer: "неа" 
                    },
                    { 
                        text: "[SELECT_WORD] го гледаат филмот.", 
                        options: ["Нив", "Тие"], 
                        answer: "Тие" 
                    },
                    { 
                        text: "Наставникот му се јави на [SELECT_WORD].", 
                        options: ["тој", "него"], 
                        answer: "него" 
                    },
                    { 
                        text: "Јас и [SELECT_WORD] одиме во паркот.", 
                        options: ["тој", "него"], 
                        answer: "тој" 
                    },
                    { 
                        text: "Ве молиме, дојдете со [SELECT_WORD].", 
                        options: ["нас", "ние"], 
                        answer: "нас" 
                    },
                    { 
                        text: "[SELECT_WORD] е многу убава.", 
                        options: ["Таа", "Неа"], 
                        answer: "Таа" 
                    },
                    { 
                        text: "Дали ја виде [SELECT_WORD]?", 
                        options: ["јас", "мене"], 
                        answer: "мене" 
                    },
                    { 
                        text: "Мачката го брка [SELECT_WORD].", 
                        options: ["тој", "него"], 
                        answer: "него" 
                    },
                    { 
                        text: "[SELECT_WORD] имаат голема куќа.", 
                        options: ["Тие", "Нив"], 
                        answer: "Тие" 
                    }
                ]
            }
        ];

        let currentRound = null;
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedAnswer = null; // selectedAnswer е null додека не се избере збор од менито

        const roundSelectionScreen = document.getElementById('round-selection');
        const quizScreen = document.getElementById('quiz-screen');
        const completionScreen = document.getElementById('completion-screen');
        const roundButtonsContainer = document.getElementById('round-buttons');
        const questionTextElement = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const feedbackElement = document.getElementById('feedback');
        const scoreDisplay = document.getElementById('score-display');
        const currentQuestionNr = document.getElementById('current-question-nr');
        const nextButton = document.getElementById('next-button');
        const checkButton = document.getElementById('check-button');
        const roundTitle = document.getElementById('round-title');

        // --- Helper Functions ---
        
        // Custom modal replacement for alert()
        function showMessage(type, message) {
            feedbackElement.textContent = message;
            feedbackElement.className = 'p-3 rounded-lg text-center mb-6 font-medium'; // Reset classes
            
            if (type === 'correct') {
                feedbackElement.classList.add('bg-green-100', 'text-green-800');
            } else if (type === 'incorrect') {
                feedbackElement.classList.add('bg-red-100', 'text-red-800');
            }
            feedbackElement.classList.remove('hidden');
        }

        function hideMessage() {
            feedbackElement.classList.add('hidden');
        }

        function startQuiz(roundIndex) {
            currentRound = quizData[roundIndex];
            currentQuestionIndex = 0;
            score = 0;
            scoreDisplay.textContent = score;
            roundTitle.textContent = currentRound.title;

            roundSelectionScreen.classList.add('hidden');
            completionScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            loadQuestion();
        }

        function loadQuestion() {
            hideMessage();
            nextButton.disabled = true;
            checkButton.disabled = false;
            selectedAnswer = null;
            optionsContainer.innerHTML = '';
            
            if (currentQuestionIndex >= currentRound.questions.length) {
                showCompletionScreen();
                return;
            }

            const question = currentRound.questions[currentQuestionIndex];
            currentQuestionNr.textContent = currentQuestionIndex + 1;

            // Split the text to replace the placeholder with an interactive element
            const textParts = question.text.split('[SELECT_WORD]');
            
            // Create the select dropdown
            const select = document.createElement('select');
            select.className = 'px-2 py-1 bg-white border border-indigo-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer text-indigo-700 font-semibold';
            // Овде се поставува selectedAnswer кога корисникот ќе избере опција
            select.onchange = (e) => selectedAnswer = e.target.value;
            select.innerHTML = '<option value="" disabled selected>Избери...</option>';

            // Add options
            question.options.forEach(option => {
                const opt = document.createElement('option');
                opt.value = option;
                opt.textContent = option;
                select.appendChild(opt);
            });

            // Reconstruct the question text with the select element
            questionTextElement.innerHTML = '';
            questionTextElement.appendChild(document.createTextNode(textParts[0].trim() + ' '));
            questionTextElement.appendChild(select);
            questionTextElement.appendChild(document.createTextNode(' ' + textParts[1].trim()));
        }

        function checkAnswer() {
            // Оваа проверка спречува копчето да "работи" ако selectedAnswer е null (т.е. нема ништо избрано)
            if (!selectedAnswer) {
                showMessage('incorrect', 'Ве молиме, изберете збор пред да продолжите.');
                return;
            }

            const question = currentRound.questions[currentQuestionIndex];
            checkButton.disabled = true;
            nextButton.disabled = false;

            // Disable the select element after checking
            questionTextElement.querySelector('select').disabled = true;

            if (selectedAnswer === question.answer) {
                score++;
                scoreDisplay.textContent = score;
                showMessage('correct', 'Точно! Одлично.');
            } else {
                showMessage('incorrect', `Неточно. Точниот збор е: "${question.answer}".`);
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        function showCompletionScreen() {
            quizScreen.classList.add('hidden');
            completionScreen.classList.remove('hidden');
            document.getElementById('final-score').textContent = score;
        }

        window.resetQuiz = function() {
            quizScreen.classList.add('hidden');
            completionScreen.classList.add('hidden');
            roundSelectionScreen.classList.remove('hidden');
            hideMessage();
        }

        // --- Initialization ---
        function init() {
            roundButtonsContainer.innerHTML = '';
            // Make sure the grid layout can handle 9 items nicely
            roundButtonsContainer.className = 'grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-3 gap-4';
            
            quizData.forEach((round, index) => {
                const button = document.createElement('button');
                button.className = 'bg-indigo-500 text-white font-semibold py-3 rounded-lg shadow hover:bg-indigo-600 transition duration-150';
                button.textContent = round.title.split(':')[0] || `Рунда ${index + 1}`;
                button.onclick = () => startQuiz(index);
                roundButtonsContainer.appendChild(button);
            });

            checkButton.onclick = checkAnswer;
            nextButton.onclick = nextQuestion;
        }

        // Start the application setup
        init();
    </script>
</body>
</html>
