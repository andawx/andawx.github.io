<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        /* Basic styling for the calculator */
        .calculator {
            width: 300px;
            margin: 50px auto;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            background-color: #f7f7f7;
        }

        .display {
            width: 95%;
            margin-bottom: 10px;
            padding: 10px;
            font-size: 2em;
            text-align: right;
            border: 1px solid #aaa;
            border-radius: 3px;
            background-color: #fff;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.1);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .buttons button {
            padding: 20px;
            font-size: 1.2em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #e0e0e0;
            transition: background-color 0.2s;
        }

        .buttons button:hover {
            background-color: #d0d0d0;
        }

        .buttons button.operator {
            background-color: #ff9500;
            color: white;
        }

        .buttons button.operator:hover {
            background-color: #cc7a00;
        }

        .buttons button.clear {
            background-color: #ff3b30;
            color: white;
        }

        .buttons button.clear:hover {
            background-color: #cc3028;
        }

        .buttons button.equal {
            background-color: #4cd964;
            color: white;
            grid-column: span 2; /* Span two columns for the equals button */
        }

        .buttons button.equal:hover {
            background-color: #38a84a;
        }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" class="display" id="display" disabled>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button onclick="appendToDisplay('/')" class="operator">/</button>
        <button onclick="appendToDisplay('*')" class="operator">×</button>
        <button onclick="appendToDisplay('-')" class="operator">−</button>

        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>
        <button onclick="appendToDisplay('+')" class="operator">+</button>

        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>

        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>

        <button onclick="appendToDisplay('0')">0</button>
        <button onclick="appendToDisplay('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');
    let currentInput = '';
    let result = null;
    let operator = null;
    let waitForOperand = false;

    // Function to append characters to the display
    function appendToDisplay(value) {
        if (value === '.' && currentInput.includes('.')) return;

        // Reset if a calculation was just performed
        if (waitForOperand && !['+', '-', '*', '/'].includes(value)) {
            currentInput = '';
            waitForOperand = false;
        }

        currentInput += value;
        display.value = currentInput;
    }

    // Function to clear the display
    function clearDisplay() {
        currentInput = '';
        result = null;
        operator = null;
        waitForOperand = false;
        display.value = '';
    }

    // Function to calculate the result
    function calculate() {
        try {
            // Use the built-in eval() function to calculate the expression
            // NOTE: eval() is powerful but should be used carefully in production for security.
            // For a simple calculator like this, it is acceptable.
            let finalResult = eval(currentInput);
            display.value = finalResult;
            currentInput = String(finalResult);
            waitForOperand = true;
        } catch (e) {
            display.value = 'Error';
            currentInput = '';
            waitForOperand = true; // Stay in a reset state after an error
        }
    }
</script>

</body>
</html>
