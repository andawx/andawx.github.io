<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квиз за вежбање граматика</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .highlighted-round {
            /* Custom style for the suggested next round */
            box-shadow: 0 0 0 4px #a5b4fc; /* Tailwind indigo-300 */
            border: 2px solid #4f46e5; /* Tailwind indigo-600 */
            transform: scale(1.03);
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex items-center justify-center">

    <div id="quiz-container" class="w-full max-w-xl bg-white shadow-2xl rounded-xl p-6 md:p-10 border border-gray-100">
        <h1 class="text-3xl font-extrabold text-indigo-700 mb-6 text-center">Квиз за вежбање граматика</h1>

        <!-- Loading indicator for Firebase -->
        <div id="loading-indicator" class="text-center p-8">
            <svg class="animate-spin h-8 w-8 text-indigo-500 mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-gray-600">Вчитување на податоци...</p>
        </div>

        <!-- Round Selection Screen -->
        <div id="round-selection" class="text-center hidden">
            <p id="progress-message" class="text-lg text-gray-700 mb-6"></p>
            <div id="round-buttons" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-3 gap-4">
                <!-- Buttons will be injected here -->
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <h2 id="round-title" class="text-2xl font-bold text-gray-800 mb-4 text-center"></h2>
            
            <div class="bg-indigo-50 p-4 rounded-lg mb-6 shadow-inner">
                <p class="text-sm font-semibold text-indigo-600">Прашање <span id="current-question-nr"></span>/10</p>
                <p id="question-text" class="text-xl mt-2 font-medium text-gray-900"></p>
            </div>

            <p class="text-md font-semibold text-gray-600 mb-3">Избери го точниот збор:</p>

            <div id="options-container" class="space-y-3 mb-6">
                <!-- Options will be injected here -->
            </div>

            <div id="feedback" class="p-3 rounded-lg text-center mb-6 hidden font-medium"></div>

            <div class="flex justify-between items-center">
                <p class="text-lg font-bold text-gray-700">Резултат: <span id="score-display" class="text-indigo-600">0</span></p>
                <button id="next-button" class="px-6 py-3 bg-indigo-600 text-white font-bold rounded-lg shadow-md hover:bg-indigo-700 transition duration-150 disabled:bg-gray-400" disabled>
                    Следно
                </button>
                <button id="check-button" class="px-6 py-3 bg-green-500 text-white font-bold rounded-lg shadow-md hover:bg-green-600 transition duration-150">
                    Провери го одговорот
                </button>
            </div>
        </div>

        <!-- Completion Screen -->
        <div id="completion-screen" class="hidden text-center">
            <h2 class="text-3xl font-extrabold text-green-600 mb-4">Рунда завршена!</h2>
            <p class="text-xl text-gray-700 mb-6">Вашиот финален резултат е: <span id="final-score" class="text-green-600 font-bold"></span>/10</p>
            <button onclick="resetQuiz()" class="px-6 py-3 bg-indigo-600 text-white font-bold rounded-lg shadow-md hover:bg-indigo-700 transition duration-150">
                Избери друга рунда
            </button>
        </div>
    </div>

                        text: "Тоа е [SELECT_WORD] куче.", 
                        options: ["нивно", "нивни", "нивна"], 
                        answer: "нивно" 
                    },
                    { 
                        text: "Оваа куќа е [SELECT_WORD].", 
                        options: ["наш", "наша", "наше"], 
                        answer: "наша" 
                    },
                    { 
                        text: "[SELECT_WORD] клучеви се овие?", 
                        options: ["Чии", "Чие", "Чија"], 
                        answer: "Чии" 
                    },
                    { 
                        text: "Тие одат со [SELECT_WORD] автомобил.", 
                        options: ["нашиот", "наши", "нашата"], 
                        answer: "нашиот" 
                    },
                    { 
                        text: "Дали е ова [SELECT_WORD] топка?", 
                        options: ["негова", "негово", "негов"], 
                        answer: "негова" 
                    },
                    { 
                        text: "[SELECT_WORD] се овие чевли?", 
                        options: ["Чија", "Чии", "Чие"], 
                        answer: "Чии" 
                    },
                    { 
                        text: "Тие се [SELECT_WORD] пријатели.", 
                        options: ["мој", "моја", "мои"], 
                        answer: "мои" 
                    }
                ]
            }
        ];

        let currentRound = null;
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedAnswer = null; 

        const loadingIndicator = document.getElementById('loading-indicator');
        const roundSelectionScreen = document.getElementById('round-selection');
        const quizScreen = document.getElementById('quiz-screen');
        const completionScreen = document.getElementById('completion-screen');
        const roundButtonsContainer = document.getElementById('round-buttons');
        const questionTextElement = document.getElementById('question-text');
        const feedbackElement = document.getElementById('feedback');
        const scoreDisplay = document.getElementById('score-display');
        const currentQuestionNr = document.getElementById('current-question-nr');
        const nextButton = document.getElementById('next-button');
        const checkButton = document.getElementById('check-button');
        const roundTitle = document.getElementById('round-title');
        const progressMessage = document.getElementById('progress-message');

        // --- Firebase Logic ---

        /** Gets the document reference for the user's quiz progress. */
        function getProgressDocRef() {
            if (!db || !userId) {
                console.error("Firestore or User ID not initialized.");
                return null;
            }
            // Private user data path: /artifacts/{appId}/users/{userId}/quiz_progress/progress_doc
            return doc(db, `artifacts/${appId}/users/${userId}/quiz_progress/progress_doc`);
        }

        /** Loads the last completed round index from Firestore. */
        async function loadProgress() {
            const docRef = getProgressDocRef();
            if (!docRef) return -1;

            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (typeof data.lastCompletedRoundIndex === 'number') {
                        // Ensure the loaded index is within valid bounds
                        return Math.min(data.lastCompletedRoundIndex, quizData.length - 1);
                    }
                }
            } catch (error) {
                console.error("Error loading progress:", error);
                // Return default on error
            }
            return -1;
        }

        /** Saves the last completed round index to Firestore. */
        async function saveProgress(roundIndex) {
            const docRef = getProgressDocRef();
            if (!docRef) return;

            try {
                await setDoc(docRef, { lastCompletedRoundIndex: roundIndex });
                lastCompletedRoundIndex = roundIndex;
                console.log("Progress saved:", roundIndex);
            } catch (error) {
                console.error("Error saving progress:", error);
            }
        }

        /** Initializes Firebase and authenticates the user. */
        async function initFirebase() {
            if (!firebaseConfig) {
                console.warn("Firebase config not found. Running in local mode without persistence.");
                return false;
            }

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                // Set persistence to session (optional but good practice)
                await setPersistence(auth, browserSessionPersistence);

                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                userId = auth.currentUser.uid;
                console.log("Firebase initialized. User ID:", userId);
                return true;

            } catch (error) {
                console.error("Firebase Initialization Failed:", error);
                // Fallback to non-persistent mode
                return false;
            }
        }

        // --- Quiz Logic ---
        
        // Custom modal replacement for alert()
        function showMessage(type, message) {
            feedbackElement.textContent = message;
            feedbackElement.className = 'p-3 rounded-lg text-center mb-6 font-medium'; // Reset classes
            
            if (type === 'correct') {
                feedbackElement.classList.add('bg-green-100', 'text-green-800');
            } else if (type === 'incorrect') {
                feedbackElement.classList.add('bg-red-100', 'text-red-800');
            }
            feedbackElement.classList.remove('hidden');
        }

        function hideMessage() {
            feedbackElement.classList.add('hidden');
        }

        function startQuiz(roundIndex) {
            currentRound = quizData[roundIndex];
            currentQuestionIndex = 0;
            score = 0;
            scoreDisplay.textContent = score;
            roundTitle.textContent = currentRound.title;

            roundSelectionScreen.classList.add('hidden');
            completionScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            loadQuestion();
        }

        function loadQuestion() {
            hideMessage();
            nextButton.disabled = true;
            checkButton.disabled = false;
            selectedAnswer = null;
            
            if (currentQuestionIndex >= currentRound.questions.length) {
                showCompletionScreen();
                return;
            }

            const question = currentRound.questions[currentQuestionIndex];
            currentQuestionNr.textContent = currentQuestionIndex + 1;

            // Split the text to replace the placeholder with an interactive element
            const textParts = question.text.split('[SELECT_WORD]');
            
            // Create the select dropdown
            const select = document.createElement('select');
            select.className = 'px-2 py-1 bg-white border border-indigo-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer text-indigo-700 font-semibold';
            select.onchange = (e) => selectedAnswer = e.target.value;
            select.innerHTML = '<option value="" disabled selected>Избери...</option>';

            // Add options
            question.options.forEach(option => {
                const opt = document.createElement('option');
                opt.value = option;
                opt.textContent = option;
                select.appendChild(opt);
            });

            // Reconstruct the question text with the select element
            questionTextElement.innerHTML = '';
            questionTextElement.appendChild(document.createTextNode(textParts[0].trim() + ' '));
            questionTextElement.appendChild(select);
            questionTextElement.appendChild(document.createTextNode(' ' + textParts[1].trim()));
        }

        function checkAnswer() {
            if (!selectedAnswer) {
                showMessage('incorrect', 'Ве молиме, изберете збор пред да продолжите.');
                return;
            }

            const question = currentRound.questions[currentQuestionIndex];
            checkButton.disabled = true;
            nextButton.disabled = false;

            // Disable the select element after checking
            questionTextElement.querySelector('select').disabled = true;

            if (selectedAnswer === question.answer) {
                score++;
                scoreDisplay.textContent = score;
                showMessage('correct', 'Точно! Одлично.');
            } else {
                showMessage('incorrect', `Неточно. Точниот збор е: "${question.answer}".`);
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        async function showCompletionScreen() {
            quizScreen.classList.add('hidden');
            completionScreen.classList.remove('hidden');
            document.getElementById('final-score').textContent = score;

            // Check if the current round index is the last completed round index
            // If the score is 10/10 and the current round is the next round index, save the new index
            const currentRoundIndex = quizData.indexOf(currentRound);
            const nextRoundIndex = currentRoundIndex + 1;

            if (score === currentRound.questions.length && nextRoundIndex > lastCompletedRoundIndex) {
                 // The user completed this round and it was the next in sequence
                await saveProgress(nextRoundIndex);
            }
        }

        window.resetQuiz = function() {
            quizScreen.classList.add('hidden');
            completionScreen.classList.add('hidden');
            // Re-run init to reload progress and display buttons
            init(); 
        }

        // --- Initialization ---
        async function init() {
            loadingIndicator.classList.remove('hidden');
            roundSelectionScreen.classList.add('hidden');

            // 1. Initialize Firebase (if config exists)
            const isFirebaseReady = await initFirebase();

            // 2. Load Progress
            if (isFirebaseReady) {
                lastCompletedRoundIndex = await loadProgress();
            }

            // 3. Build UI
            roundButtonsContainer.innerHTML = '';
            roundButtonsContainer.className = 'grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-3 gap-4';
            
            const nextRoundIndex = lastCompletedRoundIndex + 1;
            let suggestedRoundIndex = -1;

            if (nextRoundIndex < quizData.length) {
                suggestedRoundIndex = nextRoundIndex;
                progressMessage.textContent = `Продолжете со Рунда ${suggestedRoundIndex + 1} за да го завршите квизот!`;
            } else {
                // All rounds completed or initial state
                progressMessage.textContent = lastCompletedRoundIndex >= 0 
                    ? "Честитки! Ги завршивте сите рунди. Можете да започнете повторно."
                    : "Избери рунда за да започнеш:";
            }

            quizData.forEach((round, index) => {
                const button = document.createElement('button');
                
                let buttonClass = 'bg-indigo-500 text-white font-semibold py-3 rounded-lg shadow hover:bg-indigo-600 transition duration-150';

                // Check if this round is the suggested one
                if (index === suggestedRoundIndex) {
                    buttonClass += ' highlighted-round';
                    button.title = "Препорачана рунда за продолжување";
                }
                
                button.className = buttonClass;
                button.textContent = round.title.split(':')[0] || `Рунда ${index + 1}`;
                button.onclick = () => startQuiz(index);
                roundButtonsContainer.appendChild(button);
            });

            checkButton.onclick = checkAnswer;
            nextButton.onclick = nextQuestion;

            loadingIndicator.classList.add('hidden');
            roundSelectionScreen.classList.remove('hidden');
        }

        // Start the application setup
        init();
    </script>
</body>
</html>
